name: Dock Signal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm ci --prefix mcp --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix mcp
      - run: node --test experiments/walk-routing/test/*.test.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: dock-signal-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Re-running this job must not select an artifact left by an earlier attempt.
      DOCK_PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: ${{ env.DOCK_PAGES_ARTIFACT }}
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: ${{ env.DOCK_PAGES_ARTIFACT }}
